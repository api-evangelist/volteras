          - type: 'null'
          description: Sun roof lock status.
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - locked
      - frontRightDoor
      - frontLeftDoor
      - rearRightDoor
      - rearLeftDoor
      - frontRightWindow
      - frontLeftWindow
      - rearLeftWindow
      - rearRightWindow
      - frontTrunk
      - rearTrunk
      - sunRoof
      - timestamp
      title: VehicleSecurity
    VehicleChargeMaxStateOfCharge:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Target state of charge (as a percentage) set in the vehicle.
        unit:
          type: string
          const: percent
          title: Unit
          default: percent
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - value
      - timestamp
      title: VehicleChargeMaxStateOfCharge
  securitySchemes:
    HTTPBasic:
      type: http
      scheme: basic
    OAuth2ClientCredentialsBearer:
      type: oauth2
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /v1/oauth2/token
