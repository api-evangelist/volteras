        chargePortDoorOpen:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Chargeportdooropen
          description: Whether the charge port door is open.
        chargePortLatch:
          anyOf:
          - $ref: '#/components/schemas/VehicleChargePortLatchStateEnum'
          - type: 'null'
          description: Whether the charge port latch is closed.
      type: object
      required:
      - chargingState
      - timestamp
      - chargePortDoorOpen
      - chargePortLatch
      title: VehicleChargingState
    VehicleOdometer:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Odometer reading.
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
          description: Unit of length. Defaults to SI unit 'km'.
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - value
      - unit
      - timestamp
      title: VehicleOdometer
    VehicleTelemetry:
      properties:
        id:
          type: string
          title: Id
        odometer:
          $ref: '#/components/schemas/VehicleOdometer'
        location:
          $ref: '#/components/schemas/VehicleTelemetryLocation'
        elevation:
          $ref: '#/components/schemas/VehicleElevation'
        speed:
          $ref: '#/components/schemas/VehicleSpeed'
        heading:
          $ref: '#/components/schemas/VehicleHeading'
        stateOfCharge:
          $ref: '#/components/schemas/VehicleStateOfCharge'
        chargingState:
          $ref: '#/components/schemas/VehicleChargingState'
        range:
          $ref: '#/components/schemas/connect_models__schemas__vehicle__vehicle_telemetry__VehicleRange'
        tirePressure:
          $ref: '#/components/schemas/VehicleTirePressure'
        security:
          $ref: '#/components/schemas/VehicleSecurity'
        metadata:
          $ref: '#/components/schemas/VehicleMetaData'
        realRange:
          $ref: '#/components/schemas/VehicleRealRange'
        maxStateOfCharge:
          $ref: '#/components/schemas/VehicleChargeMaxStateOfCharge'
        chargeRemainingTime:
          $ref: '#/components/schemas/VehicleChargeRemainingTime'
        chargePowerLevel:
          $ref: '#/components/schemas/VehicleChargePowerLevel'
        chargeCurrentLimit:
          $ref: '#/components/schemas/VehicleChargeCurrentLimit'
        energyRemaining:
          $ref: '#/components/schemas/VehicleEnergyRemainingKwh'
        minStateOfCharge:
          $ref: '#/components/schemas/VehicleChargeMinStateOfCharge'
      type: object
      required:
      - id
      - odometer
      - location
      - elevation
      - speed
      - heading
      - stateOfCharge
      - chargingState
      - range
      - tirePressure
      - security
      - metadata
      - realRange
      - maxStateOfCharge
      - chargeRemainingTime
      - chargePowerLevel
      - chargeCurrentLimit
      - energyRemaining
      - minStateOfCharge
      title: VehicleTelemetry
    VehicleChargeCurrentLimit:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Current limit of the charger in amps.
        unit:
          type: string
          const: amps
          title: Unit
          default: amps
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - value
      - timestamp
      title: VehicleChargeCurrentLimit
    VehicleChargePowerLevel:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Power level of the charger in kW.
        unit:
          type: string
          const: kw
          title: Unit
          default: kw
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - value
      - timestamp
      title: VehicleChargePowerLevel
    VehicleChargeStateEnum:
      type: string
      enum:
      - STARTING
      - STOPPED
      - CHARGING
      - COMPLETE
      - DISCONNECTED
      - NO_POWER
      - CONNECTED
      - INVALID
      title: VehicleChargeStateEnum
      description: Enum for charging status.
    VehicleMetaData:
      properties:
        lastSeenAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lastseenat
          description: 'The last recorded interaction with the vehicle endpoints. This is a timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
        consentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Consentid
          description: Unique identifier for the consent that was used to retrieve the vehicle data.
        accountId:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountid
          description: Unique identifier for the account that was used to retrieve the vehicle data.
        registrationDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Registrationdate
          description: Vehicle registration date (ISO 8601, day granularity). Captured at vehicle upload; used as the date-axis baseline for service-interval alerts.
      type: object
      required:
      - lastSeenAt
      - consentId
      - accountId
      title: VehicleMetaData
    VehicleRealRange:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Range reading.
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
          description: Unit of length.
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      title: VehicleRealRange
    VehicleLockStateEnum:
      type: string
      enum:
      - OPEN
      - CLOSED
      title: VehicleLockStateEnum
      description: Enum for lock status.
    VehicleChargeMinStateOfCharge:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Minimum state of charge set in the vehicle. If this is present, the vehicle will always charge immediately when plugged in until the minimum state of charge is reached.
        unit:
          type: string
          const: percent
          title: Unit
          default: percent
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - value
      - timestamp
      title: VehicleChargeMinStateOfCharge
    VehicleTelemetryLocation:
      properties:
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Latitude ranges between -90 and 90 degrees, inclusive. Coordinate reference system is WGS84.
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: Longitude ranges between -180 and 180 degrees, inclusive. Coordinate reference system is WGS84.
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Location timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - latitude
      - longitude
      - timestamp
      title: VehicleTelemetryLocation
    VehicleEnergyRemainingKwh:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Energy remaining reading.
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
          description: No unit. Energy remaining of the battery pack in kWh.
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: 'Timestamp in ISO 8601 format: YYYY-MM-DDThh:mm:ssTZD.'
      type: object
      required:
      - value
      - unit
      - timestamp
      title: VehicleEnergyRemainingKwh
    VehicleSecurity:
      properties:
        locked:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Locked
          description: Vehicle lock status.
        frontRightDoor:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Front right door lock status.
        frontLeftDoor:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Front left door lock status.
        rearRightDoor:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Rear right door lock status.
        rearLeftDoor:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Rear left door lock status.
        frontRightWindow:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Front right window lock status.
        frontLeftWindow:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Front left window lock status.
        rearLeftWindow:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Rear left window lock status.
        rearRightWindow:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Rear right window lock status.
        frontTrunk:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Front trunk lock status.
        rearTrunk:
          anyOf:
          - $ref: '#/components/schemas/VehicleLockStateEnum'
          - type: 'null'
          description: Rear trunk lock status.
        sunRoof:
          anyOf:
