generated: '2026-07-21'
method: searched
source: https://docs.volteras.com/api-reference/errors/errors
format: volteras-error-codes
description: 'Volteras Connect API error-code registry, captured verbatim from the public errors reference.
  Codes appear in three places: CONNECT_API (synchronous API error responses), VIN_UPLOAD (async per-VIN
  results of bulk VIN connection), and COMMANDS (the failedReason field of async vehicle command executions).'
envelope:
  description: Synchronous Connect API error responses use this envelope (error field carries the code).
  fields:
  - name: requestId
    type: string
    description: ID of the request.
  - name: timestamp
    type: string
    description: An ISO8601 formatted date and time of error.
  - name: error
    type: string
    description: Error type (see registry below).
  - name: message
    type: string
    description: A human-friendly short description of the error.
  - name: data
    type: object
    description: Optional. Any additional data that helps the debug.
places:
- id: CONNECT_API
  description: Inside API error responses when calling endpoints in the Connect API, returned in the error
    field.
- id: VIN_UPLOAD
  description: Async per-VIN errors in the errors field of the bulk VIN connection results endpoint.
- id: COMMANDS
  description: Async command failures stored in the command execution failedReason field.
